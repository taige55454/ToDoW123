name: Build ToDoWell

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Resources
        run: rc.exe /nologo /fo app.res app.rc

      - name: Compile
        run: |
          cl.exe /nologo /EHsc /O2 /MT /W3 /utf-8 /D_WIN32_WINNT=0x0601 /DWINVER=0x0601 /D_NTDDI_VERSION=0x06010000 /DUNICODE /D_UNICODE main.cpp app.cpp gfx.cpp storage.cpp json.cpp app.res /Fe:ToDoWell.exe /link d2d1.lib dwrite.lib user32.lib gdi32.lib advapi32.lib winmm.lib imm32.lib shell32.lib /SUBSYSTEM:WINDOWS /MANIFEST:NO

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDoWell-${{ github.sha }}
          path: ToDoWell.exe

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ToDoWell.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
