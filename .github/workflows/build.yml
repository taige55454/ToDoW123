name: Build ToDoWell

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    - name: Compile Resources
      run: rc.exe /nologo /fo app.res app.rc
      
    - name: Compile and Link
      run: |
        cl.exe /nologo /EHsc /O2 /MT /W3 /utf-8 ^
          /D_WIN32_WINNT=0x0601 /DWINVER=0x0601 /D_NTDDI_VERSION=0x06010000 /DUNICODE /D_UNICODE ^
          main.cpp app.cpp gfx.cpp storage.cpp json.cpp app.res ^
          /Fe:ToDoWell.exe ^
          /link d2d1.lib dwrite.lib user32.lib gdi32.lib advapi32.lib winmm.lib imm32.lib shell32.lib ^
          /SUBSYSTEM:WINDOWS /MANIFEST:NO
          
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ToDoWell-${{ github.sha }}
        path: ToDoWell.exe
        
    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ToDoWell.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
